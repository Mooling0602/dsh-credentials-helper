[project]
name = "dsh-credentials-helper"
dynamic = ["version"]
description = "dsh-mloader plugin that reads and updates the harness credential references from a slash command."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["dsh-mloader-sdk", "docformatter", "ruff", "ty"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "src/mloader.plugin.json"
pattern = '"version"\s*:\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_credentials_helper"]

[tool.uv.sources]
dsh-mloader-sdk = { git = "https://github.com/Mooling0602/dsh-mloader-python-sdk" }

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "BLE", "RUF"]
